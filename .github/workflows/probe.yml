name: probe-margin
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pdfplumber
      - run: |
          mkdir -p probe
          curl -sL -A "Mozilla/5.0" -o probe/m.pdf https://www.jpx.co.jp/markets/statistics-equities/margin/tvdivq0000001rnl-att/20261008_mtall.pdf
          ls -la probe
          python - <<'PY'
          import pdfplumber, json
          out=[]
          with pdfplumber.open("probe/m.pdf") as pdf:
              out.append(f"PAGES {len(pdf.pages)}")
              for i in [0,1]:
                  out.append(f"===== PAGE {i+1} TEXT =====")
                  out.append(pdf.pages[i].extract_text() or "")
              for i,p in enumerate(pdf.pages):
                  t=p.extract_text() or ""
                  if "91040" in t or "30640" in t:
                      out.append(f"===== PAGE {i+1} (hit) TEXT =====")
                      out.append(t)
              w=pdf.pages[0].extract_words()
              out.append("===== PAGE1 WORDS =====")
              out += [f"{x['x0']:.1f}\t{x['top']:.1f}\t{x['text']}" for x in w[:400]]
          open("probe/out.txt","w").write("\n".join(out))
          PY
          rm probe/m.pdf
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout -b probe
          git add probe/out.txt
          git commit -m probe
          git push -f origin probe
