name: lowprice
on:
  workflow_dispatch:
  push:
    paths:
      - 'lowprice.py'
      - '.github/workflows/lowprice.yml'
permissions:
  contents: write
concurrency:
  group: kabu-publish
  cancel-in-progress: false
jobs:
  lowprice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python lowprice.py
        env:
          SCREENER_OUT: docs
      - name: publish
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/track
          git commit -m "lowprice $(date +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
