name: replay
on:
  workflow_dispatch:
    inputs:
      date_from:
        description: '再現の開始日（YYYY-MM-DD）'
        default: '2026-09-01'
      date_to:
        description: '再現の終了日（YYYY-MM-DD）'
        default: '2026-10-08'
  push:
    paths:
      - 'replay.py'
      - '.github/workflows/replay.yml'
permissions:
  contents: write
concurrency:
  group: kabu-publish
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python replay.py
        env:
          REPLAY_FROM: ${{ inputs.date_from }}
          REPLAY_TO: ${{ inputs.date_to }}
      - name: track
        run: python track.py
        env:
          SCREENER_OUT: docs
      - name: publish
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/signals docs/track
          git commit -m "replay $(date +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
