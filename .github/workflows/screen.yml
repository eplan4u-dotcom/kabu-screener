name: daily-screen
on:
  schedule:
    - cron: '30 7 * * 1-5'   # 平日 16:30（日本時間）
  workflow_dispatch:
    inputs:
      mail:
        description: 'メールを送る'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kabu-publish
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python screener.py --no-open
        env:
          SCREENER_OUT: docs
      - name: track
        run: python track.py
        continue-on-error: true
        env:
          SCREENER_OUT: docs
      - name: publish
        run: |
          cp docs/latest.html docs/index.html
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs data
          git commit -m "screen $(date +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      - name: mail
        if: github.event_name != 'workflow_dispatch' || inputs.mail
        run: python send_mail.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
